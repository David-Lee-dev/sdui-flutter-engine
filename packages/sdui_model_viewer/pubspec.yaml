name: sdui_model_viewer
description: "WebView renderer for the sdui_engine `model` widget, backed by Google's <model-viewer>."
version: 0.1.0
repository: https://github.com/David-Lee-dev/sdui-flutter-engine
publish_to: http://100.115.77.18:28400/api/packages/david/pub

environment:
  sdk: ^3.10.8
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_inappwebview: ^6.1.5
  http: ^1.2.0
  # Path while the renderer and the `model` widget land together; switch to
  # the hosted `^0.15.0` before publishing.
  sdui_engine:
    path: ../..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/model-viewer-umd.min.js

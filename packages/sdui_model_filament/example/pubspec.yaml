name: model_3d_bench
description: "Device measurement app for the sdui_engine model_3d widget on the Filament renderer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sdui_engine:
    path: ../../..
  thermion_flutter: ^0.6.1
  sdui_model_filament:
    path: ..

# The renderer pins the registry engine; measure against this checkout.
dependency_overrides:
  sdui_engine:
    path: ../../..

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/

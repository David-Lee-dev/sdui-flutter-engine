name: sdui_engine
description: "Server-driven UI engine for Flutter: compiles JSON templates into a live, reactive widget tree with actions, drivers, and motion."
version: 0.17.3
repository: https://github.com/David-Lee-dev/sdui-flutter-engine
publish_to: http://100.115.77.18:28400/api/packages/david/pub

environment:
  sdk: ^3.10.8
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  fl_chart: ^1.1.1
  go_router: ^14.8.1
  http: ^1.2.0
  loading_animation_widget: ^1.3.0
  meta: ^1.16.0
  skeletonizer: ^2.1.0+1
  smooth_page_indicator: ^1.2.1
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.2
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/sdf_shapes.frag
  plugin:
    platforms:
      android:
        package: dev.davidlee.sdui_engine
        pluginClass: SduiEnginePlugin
      ios:
        pluginClass: SduiEnginePlugin
